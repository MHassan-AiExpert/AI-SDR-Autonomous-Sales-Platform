name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Docker Compose stack
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example config --quiet
      - name: Infrastructure and database tests
        run: npm test
