# AI SDR Autonomous Sales Platform - orchestration stack
#
# n8n runs in queue mode: the main instance receives webhooks and schedules
# work, Redis holds the job queue, and stateless workers execute jobs for every
# workspace in parallel. Scale throughput by adding workers:
#   docker compose up -d --scale n8n-worker=4
#
# The agent service runs the AI agents (campaign planning, lead sourcing).
# n8n's scheduler calls it every minute with a signed request; it claims queued
# jobs from Supabase. Scale it the same way: --scale agent-service=3
#
# Application data (workspaces, leads, deals) lives in Supabase and is managed
# by the migrations in /supabase. The Postgres service below stores only n8n's
# own state (workflows, executions).

name: ai-sdr

x-n8n-image: &n8n-image n8nio/n8n:2.47.5

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n-postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
  DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}
  DB_POSTGRESDB_POOL_SIZE: ${N8N_DB_POOL_SIZE:-5}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
  N8N_RUNNERS_ENABLED: "true"
  N8N_HOST: ${N8N_HOST:-localhost}
  N8N_PORT: "5678"
  N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
  WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
  TZ: ${GENERIC_TIMEZONE:-UTC}
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-336}
  N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
  N8N_LOG_FORMAT: json
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_METRICS: "true"
  # Platform services reached from workflows
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  PLATFORM_HMAC_SECRET: ${PLATFORM_HMAC_SECRET:?PLATFORM_HMAC_SECRET is required}
  AGENT_SERVICE_URL: http://agent-service:8080
  # Lets the scheduler workflow sign requests to the agent service
  NODE_FUNCTION_ALLOW_BUILTIN: crypto

services:
  n8n-postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # noeviction: queued jobs must never be dropped under memory pressure
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One-shot: loads every workflow in infra/n8n/workflows into n8n, then exits.
  # The repository is the source of truth; edits made only in the editor are
  # replaced on the next start, so export changes back into that folder.
  n8n-import:
    image: *n8n-image
    restart: "no"
    entrypoint: ["node", "/import/import-workflows.mjs"]
    environment:
      <<: *n8n-env
      WORKFLOWS_DIR: /workflows
    volumes:
      - ./n8n/workflows:/workflows:ro
      - ./n8n/import-workflows.mjs:/import/import-workflows.mjs:ro
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
    networks: [internal]

  n8n:
    image: *n8n-image
    restart: unless-stopped
    environment:
      <<: *n8n-env
    ports:
      # Bound to localhost; expose publicly only through a reverse proxy with TLS
      - "127.0.0.1:${N8N_PUBLISHED_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

  n8n-worker:
    image: *n8n-image
    restart: unless-stopped
    command: ["worker", "--concurrency=${N8N_WORKER_CONCURRENCY:-10}"]
    environment:
      <<: *n8n-env
    deploy:
      replicas: ${N8N_WORKER_REPLICAS:-2}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

  agent-service:
    build: ../agents
    image: ai-sdr/agents:0.5.0
    restart: unless-stopped
    environment:
      # Supabase connection pooler (transaction mode) URL for the backend
      DATABASE_URL: ${AGENT_DATABASE_URL:?AGENT_DATABASE_URL is required}
      PLATFORM_HMAC_SECRET: ${PLATFORM_HMAC_SECRET:?PLATFORM_HMAC_SECRET is required}
      PORT: "8080"
      JOBS_PER_RUN: ${AGENT_JOBS_PER_RUN:-3}
      # Hours between automatic sourcing and enrichment runs per active campaign (0 = off)
      SCHEDULE_HOURS: ${AGENT_SCHEDULE_HOURS:-24}
      # Web app address, used for links in Slack alerts
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    deploy:
      replicas: ${AGENT_SERVICE_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [internal]

volumes:
  n8n_postgres_data:
  redis_data:
  n8n_data:

networks:
  internal:
    driver: bridge
